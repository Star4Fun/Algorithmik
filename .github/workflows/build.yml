name: Build LaTeX

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PDFs
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            texlive/texlive:latest \
            sh -c "apt-get update && apt-get install -y make && make -j2 all"

      - name: Collect PDFs
        run: |
          mkdir -p dist

          find Task[0-9]* -maxdepth 1 \
            -type f -name 'Blatt*.pdf' \
            -exec cp -t dist/ {} +

          test -n "$(find dist -name '*.pdf' -print -quit)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exercise-sheets
          path: dist/*.pdf
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download PDFs
        uses: actions/download-artifact@v4
        with:
          name: exercise-sheets
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.pdf \
            --verify-tag \
            --title "Exercise Sheets $TAG" \
            --generate-notes
